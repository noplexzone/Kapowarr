name: Tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        
    steps:
      - uses: actions/checkout@v3
        name: Set up checkout
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        name: Set up Python ${{ matrix.python-version }}
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - run: pip install -r requirements.txt pytest
        name: Install dependencies

      - run: |
          mkdir db
          python -m unittest discover -s ./tests -p '*.py'
        name: Run Tests

  frontend:
    name: Frontend tests and build budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        name: Set up checkout

      - uses: actions/setup-node@v4
        name: Set up Node.js
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        name: Install frontend dependencies

      - run: npm test -- --run
        name: Run frontend tests

      - run: npm run build:check
        name: Build frontend and enforce budgets

      - run: npx playwright install --with-deps chromium
        name: Install Chromium for production smoke tests

      - run: npm run test:e2e
        name: Run production browser and accessibility tests

  docker:
    name: Build and publish develop image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [test, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read application version
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              print(f"value={tomllib.load(handle)['project']['version']}")
          PY

      - name: Build and push develop tags
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            noplexzone/kapowarr:develop
            noplexzone/kapowarr:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
